# @file ci.yml
# @project PipkerOps
# @module delivery/ci
# @description 验证源码与双架构运行镜像，发布相同镜像和可手工安装的 Agent。
# @logic 检查版本及原生验收通过后，为 master 提交发布镜像与完整 Release。
# @dependencies GitHub Actions, Docker Buildx, Node.js 24, Go 1.26
# @index_tags ci, ghcr, agent, release
# @author holic512
name: CI and release

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      version: ${{ steps.metadata.outputs.version }}
      tags: ${{ steps.metadata.outputs.tags }}
      publish: ${{ steps.metadata.outputs.publish }}
      release: ${{ steps.metadata.outputs.release }}
      agent_version: ${{ steps.metadata.outputs.agent_version }}
      skill_version: ${{ steps.metadata.outputs.skill_version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve publication policy and component versions
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node scripts/check-component-versions.mjs "$BASE" > "$RUNNER_TEMP/versions.json"
          node <<'NODE'
          const fs = require('node:fs');
          const versions = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/versions.json`, 'utf8'));
          const { EVENT_NAME: event, REF: ref, REPOSITORY: repository, COMMIT: commit } = process.env;
          const publish = ref === 'refs/heads/master' && event === 'push';
          const image = `ghcr.io/${repository.toLowerCase()}`;
          const outputs = { image, version: versions.ops, agent_version: versions.agent, skill_version: versions.skill,
            tags: JSON.stringify(publish ? [versions.ops, 'edge', 'latest', `sha-${commit}`] : []), publish, release: publish };
          fs.appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(outputs).map(([key, value]) => `${key}=${value}\n`).join(''));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Ops ${versions.ops}; Agent ${versions.agent}; Skill ${versions.skill}\n`);
          NODE

  checks:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: node scripts/check-secrets.mjs --all
      - name: Check shell syntax
        run: find deploy scripts agent tests -type f -name '*.sh' -print0 | xargs -0 -r -n 1 sh -n
      - name: Verify deployment package validation and menus
        run: python3 -m unittest discover -s tests -p '*_test.py'
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run check
      - run: npm run lint
      - run: npm test

  agent:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Test Agent on its native architecture
        working-directory: agent
        run: go test -race ./...
      - name: Package and check version
        env:
          VERSION: ${{ needs.metadata.outputs.agent_version }}
          ARCH: ${{ matrix.arch }}
        run: |
          sh scripts/package-agent.sh "$VERSION" "$ARCH"
          binary="dist/agent/pipker-agent-$VERSION-linux-$ARCH"
          test "$("$binary" --version)" = "$VERSION"
          cd dist/agent
          sha256sum -c "SHA256SUMS-linux-$ARCH"
      - name: Verify actual installation and configuration preservation
        env:
          VERSION: ${{ needs.metadata.outputs.agent_version }}
          ARCH: ${{ matrix.arch }}
        run: sudo sh tests/agent-install.integration.sh "dist/agent/pipker-agent-$VERSION-linux-$ARCH" "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-${{ matrix.arch }}
          path: dist/agent/*
          if-no-files-found: error
          retention-days: 7

  images:
    needs: [metadata, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and load the candidate image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/resources/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          provenance: false
          tags: pipkerops:test
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.arch }}
      - name: Verify deployment using the candidate image
        env:
          IMAGE: pipkerops:test
        run: sudo env IMAGE="$IMAGE" sh tests/deployment.integration.sh
      - name: Save the verified image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/verified-image"
          docker image inspect --format '{{.Id}}' pipkerops:test > "$RUNNER_TEMP/verified-image/image-id"
          docker save pipkerops:test | gzip -1 > "$RUNNER_TEMP/verified-image/image.tar.gz"
          cd "$RUNNER_TEMP/verified-image"
          sha256sum image.tar.gz image-id > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/verified-image/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  push-images:
    needs: [metadata, checks, agent, images]
    if: needs.metadata.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-image-${{ matrix.arch }}
          path: verified-image
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the exact verified image
        env:
          IMAGE_NAME: ${{ needs.metadata.outputs.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          cd verified-image
          sha256sum -c SHA256SUMS
          docker load -i image.tar.gz
          test "$(docker image inspect --format '{{.Id}}' pipkerops:test)" = "$(cat image-id)"
          reference="$IMAGE_NAME:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH"
          docker tag pipkerops:test "$reference"
          docker push "$reference"
          mkdir -p "$RUNNER_TEMP/image-digest"
          docker image inspect --format '{{index .RepoDigests 0}}' "$reference" > "$RUNNER_TEMP/image-digest/$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-digest/*
          if-no-files-found: error
          retention-days: 3

  manifest:
    needs: [metadata, push-images]
    permissions:
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: image-digest-*
          path: image-digest
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the two-platform manifest
        env:
          IMAGE_NAME: ${{ needs.metadata.outputs.image }}
          TAGS_JSON: ${{ needs.metadata.outputs.tags }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const image = process.env.IMAGE_NAME;
          const tags = JSON.parse(process.env.TAGS_JSON);
          const sources = ['amd64', 'arm64'].map(arch => fs.readFileSync(`image-digest/${arch}`, 'utf8').trim());
          execFileSync('docker', ['buildx', 'imagetools', 'create', ...tags.flatMap(tag => ['--tag', `${image}:${tag}`]), ...sources], { stdio: 'inherit' });
          const manifest = JSON.parse(execFileSync('docker', ['buildx', 'imagetools', 'inspect', '--raw', `${image}:${tags[0]}`], { encoding: 'utf8' }));
          const platforms = manifest.manifests.map(item => `${item.platform.os}/${item.platform.architecture}`).sort();
          if (JSON.stringify(platforms) !== JSON.stringify(['linux/amd64', 'linux/arm64'])) throw new Error(`Unexpected published platforms: ${platforms}`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, tags.map(tag => `Published \`${image}:${tag}\`\n`).join(''));
          NODE

  release:
    needs: [metadata, manifest, agent]
    if: needs.metadata.outputs.release == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: agent-*
          path: dist/release
          merge-multiple: true
      - name: Package, verify and publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OPS_VERSION: ${{ needs.metadata.outputs.version }}
          AGENT_VERSION: ${{ needs.metadata.outputs.agent_version }}
          SKILL_VERSION: ${{ needs.metadata.outputs.skill_version }}
        run: |
          set -euo pipefail
          sh scripts/package-release.sh "$OPS_VERSION" "$SKILL_VERSION" dist/release
          cd dist/release
          sha256sum -c SHA256SUMS-linux-amd64
          sha256sum -c SHA256SUMS-linux-arm64
          rm SHA256SUMS-linux-amd64 SHA256SUMS-linux-arm64
          assets=("pipkerops-deploy-$OPS_VERSION.tar.gz" "pipker-agent-$AGENT_VERSION-linux-amd64.tar.gz" "pipker-agent-$AGENT_VERSION-linux-arm64.tar.gz" "pipker-agent-$AGENT_VERSION-linux-amd64" "pipker-agent-$AGENT_VERSION-linux-arm64" "pipkerops-skill-$SKILL_VERSION.tar.gz")
          sha256sum "${assets[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
          tag="release-$GITHUB_RUN_NUMBER-${GITHUB_SHA:0:7}"
          title="Ops v$OPS_VERSION · Agent v$AGENT_VERSION · Skill v$SKILL_VERSION"
          subject=$(git log -1 --format=%s "$GITHUB_SHA")
          printf 'Commit: `%s`\n\n%s\n\nOps: `%s`  \nAgent: `%s`  \nSkill: `%s`\n' "$GITHUB_SHA" "$subject" "$OPS_VERSION" "$AGENT_VERSION" "$SKILL_VERSION" > "$RUNNER_TEMP/release-notes.md"
          cat >> "$RUNNER_TEMP/release-notes.md" <<'NOTES'

          ## Assets

          - `pipkerops-deploy-*.tar.gz`: standalone Python deployment menu for the control plane and Agent management.
          - `pipker-agent-*-linux-amd64.tar.gz` / `*-arm64.tar.gz`: Agent installation packages. Download the matching architecture and `SHA256SUMS` from this release, upload both to the same directory on the target Linux host, then install through the Agent menu.
          - `pipker-agent-*-linux-amd64` / `*-arm64`: raw ELF binaries for online Agent upgrades.
          - `pipkerops-skill-*.tar.gz`: PipkerOpsSkill package.
          - `SHA256SUMS`: SHA-256 checksums for the six release files above.
          NOTES
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes --latest
          else
            gh release edit "$tag" --title "$title"
          fi
          assets+=(SHA256SUMS)
          for asset in "${assets[@]}"; do
            gh release upload "$tag" "$asset" --clobber
          done
