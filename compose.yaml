name: pipkerops
x-runtime: &runtime
  image: pipkerops:${PIPKEROPS_VERSION:-local}
  build:
    context: .
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  environment: &environment
    NODE_ENV: production
    APP_ORIGIN: ${APP_ORIGIN:?Set HTTPS APP_ORIGIN}
    DATABASE_URL: postgresql://pipkerops:${POSTGRES_PASSWORD:?Set URL-safe POSTGRES_PASSWORD}@postgres:5432/pipkerops?sslmode=disable
    REDIS_URL: redis://:${REDIS_PASSWORD:?Set URL-safe REDIS_PASSWORD}@redis:6379/0
    PKI_DIR: /app/.data/pki
    PKI_HOSTS: ${PKI_HOSTS:?Set Gateway DNS/IP SANs}
    GATEWAY_HOST: 0.0.0.0
    GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:?Set wss Gateway URL}
    ENROLL_PUBLIC_URL: ${ENROLL_PUBLIC_URL:?Set https enrollment URL}
    BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:?Set initial administrator email}
    BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?Set initial administrator password}
    BOOTSTRAP_NAME: ${BOOTSTRAP_NAME:-管理员}
  volumes:
    - pki:/app/.data/pki
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pipkerops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set URL-safe POSTGRES_PASSWORD}
      POSTGRES_DB: pipkerops
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U pipkerops -d pipkerops']
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set URL-safe REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
  init:
    <<: *runtime
    restart: 'no'
    command: [sh, -c, 'npx prisma migrate deploy && npx tsx scripts/bootstrap.ts && npx tsx scripts/pki.ts']
  web:
    <<: *runtime
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 10s
      retries: 5
  gateway:
    <<: *runtime
    command: [npx, tsx, src/server/gateway.ts]
    ports: ['${GATEWAY_BIND:-0.0.0.0}:9443:9443','${GATEWAY_BIND:-0.0.0.0}:9444:9444']
    depends_on:
      init: {condition: service_completed_successfully}
  worker:
    <<: *runtime
    command: [npx, tsx, src/server/worker.ts]
    depends_on:
      init: {condition: service_completed_successfully}
  proxy:
    image: nginx:1.28-alpine-slim
    restart: unless-stopped
    ports: ['${WEB_BIND:-0.0.0.0}:443:443']
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${WEB_TLS_DIR:-./certs/web}:/etc/nginx/tls:ro
    depends_on:
      web: {condition: service_healthy}
volumes:
  postgres-data:
  redis-data:
  pki:
