name: ${COMPOSE_PROJECT_NAME:-pipkerops}
x-runtime: &runtime
  image: ${PIPKEROPS_IMAGE:-ghcr.io/holic512/pipkerops}:${PIPKEROPS_VERSION:-0.1.3}
  restart: unless-stopped
  environment:
    NODE_ENV: production
  extra_hosts: ["host.docker.internal:host-gateway"]
  volumes:
    - type: bind
      source: ${DEPLOY_CONFIG}
      target: /app/config
      read_only: true
      bind: { create_host_path: false }
    - type: bind
      source: ${DEPLOY_DATA}/credentials
      target: /app/.data/credentials
      bind: { create_host_path: false }
    - type: bind
      source: ${DEPLOY_DATA}/backups
      target: /app/.data/backups
      bind: { create_host_path: false }
    - type: bind
      source: ${DEPLOY_DATA}/releases
      target: /app/.data/releases
      bind: { create_host_path: false }
services:
  init:
    <<: *runtime
    restart: "no"
    command: [init]
  web:
    <<: *runtime
    command: [web]
    depends_on:
      init: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://127.0.0.1:3000/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
  gateway:
    <<: *runtime
    command: [gateway]
    depends_on:
      init: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, node, --import, tsx, deploy/resources/health.ts]
      interval: 5s
      timeout: 5s
      retries: 12
  worker:
    <<: *runtime
    command: [worker]
    depends_on:
      init: { condition: service_completed_successfully }
  proxy:
    image: nginx:1.28-alpine-slim
    restart: unless-stopped
    ports: ["${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"]
    volumes:
      - ${DEPLOY_NGINX}:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web: { condition: service_healthy }
      gateway: { condition: service_healthy }
