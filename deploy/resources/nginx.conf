# HTTPS 由外部可信代理终止；保留其覆盖后的单值协议声明。
map $http_x_forwarded_proto $external_scheme {
    default http;
    https https;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
upstream pipkerops_web {
    zone pipkerops_web 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server web:3000 resolve;
}
upstream pipkerops_gateway {
    zone pipkerops_gateway 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server gateway:9444 resolve;
}
server {
    listen 80;
    client_max_body_size 1m;
    server_tokens off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $external_scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_buffering off;
    location /api/terminal/ws {
        proxy_pass http://pipkerops_gateway;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location / {
        proxy_pass http://pipkerops_web;
        proxy_read_timeout 60s;
    }
}
